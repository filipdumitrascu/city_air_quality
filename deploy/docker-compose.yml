services:
  redis:
    image: redis:7-alpine
    container_name: cityairq-redis
    volumes:
      - ../backend/config/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  questdb:
    image: questdb/questdb:latest
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    container_name: cityairq-questdb
    ports:
      - "9000:9000"
      - "8812:8812"
      - "9009:9009"
    volumes:
      - questdb-data:/var/lib/questdb
    networks:
      - backend-network
    environment:
      - QDB_CAIRO_COMMIT_LAG=1000
      - QDB_PG_ENABLED=true
    restart: unless-stopped

  database-service:
    build:
      context: ../backend
      dockerfile: microservices/database_service/Dockerfile
    container_name: cityairq-database
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://admin:quest@questdb:8812/qdb
      - REDIS_HOST=redis
      - FORECAST_SERVICE_URL=http://forecast-service:8000
      - ENABLE_GAP_FILL=true
      - LOG_LEVEL=INFO
    depends_on:
      questdb:
        condition: service_started
    networks:
      - backend-network
    restart: unless-stopped

  routing-service:
    build: 
      context: ../backend
      dockerfile: microservices/routing_service/Dockerfile
    container_name: cityairq-routing
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_SERVICE_URL=http://database-service:8000
      - FORECAST_SERVICE_URL=http://forecast-service:8000
      - LOG_LEVEL=INFO
    ports:
      - "8080:8000"
    depends_on:
      redis:
        condition: service_healthy
      database-service:
        condition: service_started
    networks:
      - backend-network
    restart: unless-stopped

  forecast-service:
    build:
      context: ../backend
      dockerfile: microservices/forecast_service/Dockerfile
    container_name: cityairq-forecast
    environment:
      - DATABASE_SERVICE_URL=http://database-service:8000
      - MODEL_PATH=/app/model/polpred.pkl
      - GRID_RESOLUTION=0.002
      - LOG_LEVEL=INFO
    ports:
      - "8004:8000"
    volumes:
      - ./model:/app/model:ro
    depends_on:
      - database-service
    networks:
      - backend-network
    restart: unless-stopped

  data-provider-service:
    build:
      context: ../backend
      dockerfile: microservices/data_provider_service/Dockerfile
    container_name: cityairq-data-provider
    volumes:
      - ./credentials.json:/app/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
      - DATABASE_SERVICE_URL=http://database-service:8000
      - REDIS_HOST=redis
      - GCP_PROJECT_ID=cityairq
    ports:
      - "8002:8001"
    depends_on:
      - database-service
    networks:
      - backend-network
    restart: unless-stopped

  ingest-service:
    build:
      context: ../backend
      dockerfile: microservices/ingest_service/Dockerfile
    container_name: cityairq-ingest
    volumes:
      - ./credentials.json:/app/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
      - DATABASE_SERVICE_URL=http://database-service:8000
      - GCP_PROJECT_ID=cityairq
    ports:
      - "8003:8002"
    depends_on:
      - database-service
    networks:
      - backend-network
    restart: unless-stopped

  client-message-handler:
    build:
      context: ../backend
      dockerfile: microservices/client_message_handler/Dockerfile
    container_name: cityairq-client-handler
    volumes:
      - ./credentials.json:/app/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
      - DATABASE_SERVICE_URL=http://database-service:8000
      - ROUTING_SERVICE_URL=http://routing-service:8000
      - REDIS_HOST=redis
      - GCP_PROJECT_ID=cityairq
    ports:
      - "8000:8000"
    depends_on:
      - database-service
      - routing-service
    networks:
      - backend-network
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: cityairq-frontend
    environment:
      - API_URL=http://client-message-handler:8000
    ports:
      - "3000:8080"
    depends_on:
      - client-message-handler
    networks:
      - backend-network
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  questdb-data:
    driver: local

networks:
  backend-network:
    driver: bridge
