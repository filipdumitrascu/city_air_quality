apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-provider-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-provider-service
  template:
    metadata:
      labels:
        app: data-provider-service
    spec:
      containers:
      - name: data-provider-service
        image: us-central1-docker.pkg.dev/elite-totem-484208-e2/cityairq-images/cityairq-data_provider_service:latest
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /app/credentials.json
        - name: DATABASE_SERVICE_URL
          value: "http://database-service:8000"
        - name: REDIS_HOST
          value: "redis-service"
        - name: GCP_PROJECT_ID
          value: "elite-totem-484208-e2"
        volumeMounts:
        - name: credentials-volume
          mountPath: /app/credentials.json
          subPath: credentials.json
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: credentials-volume
        secret:
          secretName: credentials-secret
---
apiVersion: v1
kind: Service
metadata:
  name: data-provider-service
  namespace: default
  labels:
    app: data-provider-service
spec:
  selector:
    app: data-provider-service
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  type: ClusterIP
