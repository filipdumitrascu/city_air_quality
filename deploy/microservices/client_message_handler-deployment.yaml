apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-message-handler
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-message-handler
  template:
    metadata:
      labels:
        app: client-message-handler
    spec:
      containers:
      - name: client-message-handler
        image: us-central1-docker.pkg.dev/cityairq/cityairq-images/cityairq-client_message_handler:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: access-secret
              key: ACCESS_KEY
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /app/credentials.json
        - name: ROUTING_SERVICE_URL
          value: "http://routing-service:8000"
        - name: DATABASE_SERVICE_URL
          value: "http://database-service:8000"
        - name: REDIS_HOST
          value: "redis-service"
        - name: GCP_PROJECT_ID
          value: "cityairq"
        volumeMounts:
        - name: credentials-volume
          mountPath: /app/credentials.json
          subPath: credentials.json
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: credentials-volume
        secret:
          secretName: credentials-secret
---
apiVersion: v1
kind: Service
metadata:
  name: client-message-handler
  namespace: default
  labels:
    app: client-message-handler
spec:
  selector:
    app: client-message-handler
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  type: LoadBalancer
