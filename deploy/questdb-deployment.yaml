apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: questdb-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard-rwo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: questdb
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: questdb
  template:
    metadata:
      labels:
        app: questdb
    spec:
      containers:
      - name: questdb
        image: questdb/questdb:latest
        ports:
        - containerPort: 9000
          name: http
        - containerPort: 8812
          name: postgres
        - containerPort: 9009
          name: influx
        env:
        - name: QDB_CAIRO_COMMIT_LAG
          value: "1000"
        - name: QDB_PG_ENABLED
          value: "true"
        volumeMounts:
        - name: questdb-data
          mountPath: /var/lib/questdb
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: questdb-data
        persistentVolumeClaim:
          claimName: questdb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: questdb-service
  namespace: default
spec:
  selector:
    app: questdb
  ports:
  - port: 9000
    targetPort: 9000
    name: http
  - port: 8812
    targetPort: 8812
    name: postgres
  - port: 9009
    targetPort: 9009
    name: influx
  type: ClusterIP
