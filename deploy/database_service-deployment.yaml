apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-service
  namespace: questdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database-service
  template:
    metadata:
      labels:
        app: database-service
    spec:
      containers:
      - name: database-service
        image: gcr.io/cityairq-pollution-project/cityairq-database_service:latest
        env:
        - name: DB_USER
          value: "admin"
        - name: DB_PASSWORD
          value: "quest"
        - name: DB_NAME
          value: "pollution_data"
        - name: DB_PORT
          value: "8812"
        - name: DB_HOST
          value: "34.22.202.140"
        ports:
        - containerPort: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: database-service
  namespace: questdb
spec:
  ports:
    - port: 8003
      targetPort: 8003
  selector:
    app: database-service
  type: LoadBalancer
