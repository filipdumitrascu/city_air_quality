<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityAirQ - Air Quality Routing</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>CityAirQ</h1>
            <p class="subtitle">Pollution-Aware Routing</p>
            
            <div class="form-section">
                <h3>Calculate Route</h3>
                
                <div class="form-group">
                    <label>Transport Mode</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="transport-mode" value="bicycle" checked>
                            By Bicycle
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="transport-mode" value="foot">
                            By Foot
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Start Point</label>
                    <div class="coord-inputs">
                        <input type="number" id="start-lat" placeholder="Latitude" step="0.0001" value="44.4268">
                        <input type="number" id="start-lon" placeholder="Longitude" step="0.0001" value="26.1025">
                    </div>
                    <button class="btn-small" onclick="setStartFromMap()">Pick from map</button>
                </div>
                
                <div class="form-group">
                    <label>End Point</label>
                    <div class="coord-inputs">
                        <input type="number" id="end-lat" placeholder="Latitude" step="0.0001" value="44.4530">
                        <input type="number" id="end-lon" placeholder="Longitude" step="0.0001" value="26.0855">
                    </div>
                    <button class="btn-small" onclick="setEndFromMap()">Pick from map</button>
                </div>
                
                <div class="form-group">
                    <label>Pollution Weight (alpha): <span id="alpha-value">1.0</span></label>
                    <input type="range" id="alpha" min="0" max="1" step="0.1" value="1.0" 
                           oninput="document.getElementById('alpha-value').textContent = this.value">
                    <div class="alpha-labels">
                        <span>Fastest</span>
                        <span>Cleanest</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Sensor Types</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="sensor-fixed" checked> Fixed Sensors</label>
                        <label><input type="checkbox" id="sensor-mobile" checked> Mobile Sensors</label>
                    </div>
                </div>
                
                <div class="button-group">
                    <button class="btn-primary" onclick="calculateRoute()">Calculate Route</button>
                    <button class="btn-clear" onclick="clearRoute()">Clear Route</button>
                </div>
            </div>
            
            <div class="form-section">
                <h3>Query Pollution Data</h3>
                
                <div class="form-group">
                    <label>Center Point</label>
                    <div class="coord-inputs">
                        <input type="number" id="query-lat" placeholder="Latitude" step="0.0001" value="44.4268">
                        <input type="number" id="query-lon" placeholder="Longitude" step="0.0001" value="26.1025">
                    </div>
                    <button class="btn-small" onclick="setQueryCenterFromMap()">Pick from map</button>
                </div>
                
                <div class="form-group">
                    <label>Radius (km): <span id="radius-value">10</span></label>
                    <input type="range" id="query-radius" min="1" max="20" step="1" value="10"
                           oninput="document.getElementById('radius-value').textContent = this.value">
                </div>
                
                <div class="form-group">
                    <label>Sensor Types</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="query-sensor-fixed" checked> Fixed Sensors</label>
                        <label><input type="checkbox" id="query-sensor-mobile" checked> Mobile Sensors</label>
                    </div>
                </div>
    
                <div class="button-group">
                    <button class="btn-secondary" onclick="queryPollutionData()">Query Data</button>
                    <button class="btn-clear" onclick="clearPollutionData()">Clear Data</button>
                </div>
            </div>

            <div class="results-section" id="results-section" style="display: none;">
                <h3>Results</h3>
                <div id="route-results"></div>
            </div>
        </div>
        
        <div class="map-container">
            <div id="map"></div>
            
            <div class="legend">
                <h4>Air Quality Index</h4>
                <div class="legend-item"><span class="legend-color" style="background: #00ff00;"></span> Good (0-50)</div>
                <div class="legend-item"><span class="legend-color" style="background: #ffff00;"></span> Moderate (50-100)</div>
                <div class="legend-item"><span class="legend-color" style="background: #ff8800;"></span> Unhealthy (100-150)</div>
                <div class="legend-item"><span class="legend-color" style="background: #ff0000;"></span> Very Unhealthy (150+)</div>
                <hr style="margin: 10px 0; border-color: #0f3460;">
                <h4>Markers</h4>
                <div class="legend-item"><span style="background:#00cc66; width:16px; height:16px; display:inline-block; border-radius:2px;"></span> Start Point</div>
                <div class="legend-item"><span style="color:#ff4444; font-weight:bold; font-size:16px;">&#10005;</span> End Point</div>
            </div>
        </div>
    </div>
    
    <div class="loading-overlay" id="loading" style="display: none;">
        <div class="spinner"></div>
        <p id="loading-text">Processing...</p>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
