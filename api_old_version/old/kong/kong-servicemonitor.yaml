apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kong
  namespace: monitoring
  labels:
    release: promstack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: kong
  namespaceSelector:
    matchNames:
      - kong
  endpoints:
    - port: metrics
      interval: 10s
