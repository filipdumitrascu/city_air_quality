# loki-values.yaml
# Helm values for loki-stack

test_pod:
  enabled: false

loki:
  enabled: true
  isDefault: true
  persistence:
    enabled: true
    size: 10Gi

promtail:
  enabled: true
  config:
    logLevel: info
    serverPort: 3101
    clients:
      - url: http://loki:3100/loki/api/v1/push

grafana:
  enabled: false

fluent-bit:
  enabled: false

prometheus:
  enabled: false

filebeat:
  enabled: false

logstash:
  enabled: false

proxy:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""
