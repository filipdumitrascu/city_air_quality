# Monitors all CityAirQ backend services
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cityairq-client-message-handler
  namespace: monitoring
  labels:
    release: prometheus
    app: cityairq
spec:
  selector:
    matchLabels:
      app: client-message-handler
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
